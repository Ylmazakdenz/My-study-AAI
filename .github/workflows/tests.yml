name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Kurulum
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check trendpipe tests
      - name: Testler (ağ ve model gerekmez)
        run: python -m pytest -q
      - name: Ayar dosyası ve örnek veri (çevrimdışı)
        run: trendpipe analyze --out-dir data/sample --run latest
