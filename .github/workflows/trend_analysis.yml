name: trend_analysis

on:
  push:
    paths: ["trend_analysis/**", ".github/workflows/trend_analysis.yml"]
  pull_request:
    paths: ["trend_analysis/**", ".github/workflows/trend_analysis.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trend_analysis
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: trend_analysis/requirements*.txt
      - name: Kurulum
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check trendpipe tests
      - name: Testler (ağ ve model gerekmez)
        run: python -m pytest -q
      - name: Ayar dosyası ve örnek veri (çevrimdışı)
        run: trendpipe analyze --out-dir data/sample --run latest
