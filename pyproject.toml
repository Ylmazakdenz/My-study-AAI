[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trendpipe"
dynamic = ["version"]
description = "Giyim markaları için trend veri hattı: veri çek → değişimi hesapla → yerel LLM ile yorumlat (SENG360)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3",
    "PyYAML>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "pydantic>=2.5,<3",
    "ollama>=0.4,<1",
    # Google Trends (ana kaynak) — resmi olmayan kütüphane
    "pytrends>=4.9.2,<5",
    "pandas>=2.0,<4",
    # zoneinfo için saat dilimi veritabanı (Windows'ta işletim sistemi sağlamaz)
    "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
trendpipe = "trendpipe.cli:main"

[tool.setuptools.dynamic]
version = {attr = "trendpipe.__version__"}

[tool.setuptools.packages.find]
include = ["trendpipe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]
