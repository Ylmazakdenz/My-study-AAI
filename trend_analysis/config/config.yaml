# Trend veri hattı ayarları.
# Bu dosyada gizli bilgi YOK. Anahtar/adres gibi bilgiler .env dosyasına yazılır (bkz. .env.example).
# Terim eklemek/çıkarmak için kodu değil bu dosyayı değiştirin.

brand:
  # Marka adı koda gömülmez; burada değiştirilebilir. Çoklu marka için ayrı config dosyaları kullanılabilir:
  #   python -m trendpipe all --config config/marka_b.yaml
  name: "Örnek Giyim Markası"
  market: "TR"
  season: "2026-2027 Sonbahar/Kış"

window:
  # Son "recent_days" günü, hemen önceki "baseline_days" günle karşılaştırırız.
  recent_days: 28
  baseline_days: 28
  # Kaynaklar son 1-2 günü geç/eksik yayımlayabildiği için bitiş tarihi bugünden bu kadar gün geridedir.
  end_offset_days: 2
  # Yıllık karşılaştırma: yakın dönem, geçen yılın aynı dönemiyle (52 hafta = 364 gün önce) karşılaştırılır.
  # Giyimde ilgi mevsimle değişir; bu karşılaştırma "mevsimsel artış" ile "sezon üstü artış"ı ayırır.
  yoy: true
  yoy_shift_days: 364
  # "Bugün" pazarın saat dilimine göre hesaplanır; bilgisayarın saat dilimi (ör. Colab'da UTC) dönemi değiştirmez.
  timezone: "Europe/Istanbul"

analysis:
  # Bir pencerede verinin en az bu oranı mevcut değilse değişim HESAPLANMAZ (eksik veri sıfır sayılmaz).
  min_coverage: 0.8
  # Kaynağın kendi kesinti günleri (tüm terimlerde aynı anda eksik günler) kapsama hesabından çıkarılır.
  # Bu çıkarmadan sonra her pencerede en az bu oranda gün kalmalı.
  min_window_days_ratio: 0.5
  # Kaynağın genel hacmi değişirse (GDELT'in izlediği haber sayısı, Vikipedi'nin toplam trafiği) ham sayılar da
  # değişir; terim ilgisi değişmiş sanılmasın diye değer kaynağın o günkü toplamına oranlanır. Sayı = oran birimi.
  # 19.11.2026: İngilizce Vikipedi'de 6 terimin hepsi geçen yıla göre %27-62 düşük çıktı (kaynak geneli düşüş).
  # Toplamı medyanın min_norm_ratio katının altındaki günler bozuk sayılıp çıkarılır.
  normalize_by_norm:
    gdelt: 10000          # 10.000 haberde
    wikimedia: 1000000    # proje toplamının milyonda biri
    wikimedia_en: 1000000
  min_norm_ratio: 0.2
  # Google Trends'te 0 "bu terim için yeterli veri yok" demektir (Google açıklaması); bu günler eksik sayılır.
  zero_is_missing: [google_trends]
  # Bu eşikten küçük yüzde değişimler "yatay" kabul edilir.
  flat_threshold_pct: 15
  # Gürültü testi: yüzde eşiğini aşan bir değişim, günden güne olağan dalgalanmadan da ayırt edilebilmeli
  # (Welch t; |t| bu değerin altındaysa "belirgin değişim yok"). 0 = kapalı.
  min_t_stat: 2.0
  # Karşılaştırma dönemi ortalaması bu değerin altındaysa "düşük hacim" uyarısı verilir (kaynak birimiyle).
  low_volume:
    google_trends: 5     # 0-100 göreli ilgi (ortalama bunun altındaysa Google "yetersiz veri" sınırında)
    wikimedia: 20        # günlük sayfa görüntüleme (Türkçe Vikipedi)
    wikimedia_en: 100    # günlük sayfa görüntüleme (İngilizce Vikipedi)
    gdelt: 3             # günlük haber sayısı

# İstek önbelleği: aynı veri (kaynak + ayarlar + sorgu + dönem) bu süre içinde kaynaktan tekrar çekilmez.
# Veri günlük ve dönem bitişi bugünden 2 gün önce olduğundan aynı gün içinde değişmez; ertesi gün dönem kayar ve
# veri kendiliğinden yeniden çekilir. Yalnızca başarılı yanıtlar saklanır. Zorla yenilemek için: --refresh
cache:
  enabled: true
  ttl_hours: 24
  dir: "data/cache"

sources:
  # Her anahtar bir kaynak örneğidir; "type" kaynağın tipidir. Aynı tipten birden fazla örnek olabilir.
  google_trends:
    type: google_trends
    # ANA KAYNAK: Türkiye'deki Google aramalarında göreli ilgi. Resmi API kapalı alfa; resmi olmayan pytrends
    # kullanılır. 19.11.2026'da ev internetinden 6/6 terim başarılı. Engellenirse hata kaydedilir, hat Vikipedi ile sürer.
    enabled: true
    geo: "TR"
    hl: "tr-TR"
    # 19.11.2026: aynı gün art arda birkaç tam çalıştırmadan sonra 2 terimde 429 alındı (yıllık seri istek sayısını
    # ikiye katladı). İstekler seyreltildi; 429'da 60 ve 120 sn beklenip tekrar denenir.
    request_interval_sec: 15
    max_retries: 2
    retry_backoff_sec: 60
    stop_after_consecutive_429: 2
    # Google aramaların örneklemini kullanır; aynı istek birkaç kez tekrarlanıp ortalaması alınabilir
    # (istek sayısı katlanır, 429 riski artar). Varsayılan 1.
    samples: 1
  wikimedia:
    type: wikimedia
    enabled: true
    # Türkçe Vikipedi ≈ Türkçe okuyucular. Hacim düşük olabilir (günde birkaç görüntüleme).
    project: "tr.wikipedia"
    access: "all-access"
    agent: "user"          # botlar hariç, gerçek kullanıcı görüntülemeleri
    request_interval_sec: 2
    max_retries: 3
    retry_backoff_sec: 20
  wikimedia_en:
    type: wikimedia
    enabled: true
    # İngilizce Vikipedi = dünya geneli ilgi; hacmi yüksek olduğu için değişimler daha güvenilir.
    project: "en.wikipedia"
    access: "all-access"
    agent: "user"
    # İlk Colab çalıştırmasında 429 (çok fazla istek) alındı: istekler arası bekleme + uzun tekrar beklemesi.
    request_interval_sec: 2
    max_retries: 3
    retry_backoff_sec: 20
    stop_after_consecutive_429: 3
  gdelt:
    type: gdelt
    # KAPALI: 4 gerçek çalıştırmada (18-19.11.2026; 3 Colab + 1 ev interneti) karşılaştırılabilir veri alınamadı:
    # tekrarlayan 429 (hız sınırı), zaman aşımı ve GDELT'in kendi veri kesintisi / izleme hacmi düşüşü.
    # Kod duruyor; denemek için: --sources gdelt ya da enabled: true
    enabled: false
    # GDELT aramayı İngilizce anahtar kelimeyle, makine çevirisi üzerinden yapar; filtreler Türkiye kaynaklı Türkçe haberler.
    source_country: "turkey"
    source_lang: "turkish"
    mode: "timelinevolraw"  # günlük eşleşen haber SAYISI (+ izlenen toplam haber 'norm')
    # GDELT yavaş yanıt verebilir ve sık isteği 429 ile reddeder: uzun zaman aşımı + bekleyerek tekrar deneme.
    request_interval_sec: 8
    timeout_sec: 90
    max_retries: 2
    retry_backoff_sec: 15  # 15, 30 sn bekleyerek tekrar dener
    # 3. Colab denemesinde (18.11.2026) GDELT tüm terimlerde 4 denemeye rağmen 429 verdi ve terim başına ~2 dk
    # beklendi (toplam ~13 dk). Art arda 2 terim 429 alırsa kalan terimler denenmez, durum kaydedilir.
    stop_after_consecutive_429: 2
# Her terim, her kaynakta farklı biçimde sorgulanır:
#   wikimedia     -> Türkçe Vikipedi makale başlığı (tam başlık, büyük/küçük harf önemli)
#   wikimedia_en  -> İngilizce Vikipedi makale başlığı
#   gdelt         -> İngilizce anahtar kelime / ifade (tırnak = tam ifade)
#   google_trends -> Türkçe arama terimi
# Bir kaynak için sorgu yazılmazsa o terim o kaynakta atlanır.
terms:
  - id: trenckot
    label: "Trençkot"
    category: "dış giyim"
    queries:
      wikimedia: "Trençkot"
      wikimedia_en: "Trench coat"
      gdelt: '"trench coat"'
      google_trends: "trençkot"
  - id: palto
    label: "Palto"
    category: "dış giyim"
    queries:
      wikimedia: "Palto"
      wikimedia_en: "Overcoat"
      gdelt: '"wool coat"'
      google_trends: "kaşe kaban"
  - id: hirka
    label: "Hırka"
    category: "üst giyim"
    queries:
      wikimedia: "Hırka"
      wikimedia_en: "Cardigan (sweater)"
      gdelt: "cardigan"
      google_trends: "hırka"
  - id: kazak
    label: "Kazak"
    category: "üst giyim"
    queries:
      wikimedia: "Kazak (giysi)"
      wikimedia_en: "Sweater"
      gdelt: "sweater"
      google_trends: "kazak"
  - id: kot_pantolon
    label: "Kot pantolon"
    category: "alt giyim"
    queries:
      wikimedia: "Kot pantolon"
      wikimedia_en: "Jeans"
      gdelt: "jeans"
      google_trends: "kot pantolon"
  - id: bot
    label: "Bot / Çizme"
    category: "ayakkabı"
    queries:
      wikimedia: "Çizme"
      wikimedia_en: "Boot"
      gdelt: "boots"
      google_trends: "kadın bot"
